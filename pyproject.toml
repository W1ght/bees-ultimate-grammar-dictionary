[project]
name = "bees-ultimate-grammar-dictionary"
version = "0.0.0"
description = "ONE unified Yomitan grammar dictionary built from multiple grammar sources"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
